<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stockroom — Office Furnishings Manager</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- SVG icon sprite. Every icon used in the app is defined here once and
       referenced via <use href="#icon-..."/>. No emoji-as-icon, no font-icons. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
      <symbol id="icon-logo" viewBox="0 0 24 24">
        <path fill="currentColor" d="M3 7l9-4 9 4-9 4-9-4zm0 5l9 4 9-4M3 17l9 4 9-4"/>
      </symbol>
      <symbol id="icon-dashboard" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M4 13h6V4H4zM14 21h6v-9h-6zM4 21h6v-5H4zM14 10h6V4h-6z"/>
      </symbol>
      <symbol id="icon-box" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
              d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9z"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
              d="M3 7.5L12 12l9-4.5M12 12v9"/>
      </symbol>
      <symbol id="icon-history" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M3 3v5h5"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M12 7v5l3 2"/>
      </symbol>
      <symbol id="icon-users" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              d="M12 5v14M5 12h14"/>
      </symbol>
      <symbol id="icon-minus" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              d="M5 12h14"/>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              d="m20 20-3.5-3.5"/>
      </symbol>
      <symbol id="icon-logout" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M16 17l5-5-5-5M21 12H9"/>
      </symbol>
      <symbol id="icon-arrow-down" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M12 5v14M19 12l-7 7-7-7"/>
      </symbol>
      <symbol id="icon-arrow-up" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M12 19V5M5 12l7-7 7 7"/>
      </symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v4M12 17h.01"/>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              d="M18 6 6 18M6 6l12 12"/>
      </symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </symbol>
      <symbol id="icon-package-in" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
              d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9z"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M3 7.5L12 12l9-4.5M12 12v9M9 9l3 3 3-3"/>
      </symbol>
      <symbol id="icon-package-out" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
              d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9z"/>
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M3 7.5L12 12l9-4.5M12 12v9M9 15l3-3 3 3"/>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
              d="M20 6 9 17l-5-5"/>
      </symbol>
      <symbol id="icon-pulse" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M3 12h4l3-9 4 18 3-9h4"/>
      </symbol>
    </defs>
  </svg>

  <div id="root">
    <!-- Login screen -->
    <div id="login-screen" class="login-wrap">
      <div class="login-card">
        <div class="brand">
          <svg class="brand-mark" aria-hidden="true"><use href="#icon-logo"/></svg>
          <div>
            <h1>Stockroom</h1>
            <p>Office furnishings manager</p>
          </div>
        </div>
        <form id="login-form" autocomplete="on">
          <label>
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required value="admin">
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required value="admin123">
          </label>
          <button type="submit" class="btn btn-primary">
            <svg class="i-18" aria-hidden="true"><use href="#icon-arrow-down"/></svg>
            Sign in
          </button>
          <p class="login-hint">Default credentials: <code>admin</code> / <code>admin123</code></p>
        </form>
        <div id="login-error" class="login-error" hidden></div>
      </div>
    </div>

    <!-- Main app shell, populated after login -->
    <div id="app-shell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-mark" aria-hidden="true"><use href="#icon-logo"/></svg>
          <div>
            <h1>Stockroom</h1>
            <p id="brand-sub">v1.0</p>
          </div>
        </div>
        <nav>
          <a href="#dashboard" data-route="dashboard" class="nav-link active">
            <svg class="i-20" aria-hidden="true"><use href="#icon-dashboard"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="#items" data-route="items" class="nav-link">
            <svg class="i-20" aria-hidden="true"><use href="#icon-box"/></svg>
            <span>Items</span>
          </a>
          <a href="#movements" data-route="movements" class="nav-link">
            <svg class="i-20" aria-hidden="true"><use href="#icon-history"/></svg>
            <span>Movements</span>
          </a>
          <a href="#users" data-route="users" class="nav-link admin-only" hidden>
            <svg class="i-20" aria-hidden="true"><use href="#icon-users"/></svg>
            <span>People</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="who" id="who">
            <svg class="i-20" aria-hidden="true"><use href="#icon-shield"/></svg>
            <div>
              <div class="who-name" id="who-name">—</div>
              <div class="who-role" id="who-role">—</div>
            </div>
          </div>
          <button class="btn btn-ghost" id="logout-btn">
            <svg class="i-18" aria-hidden="true"><use href="#icon-logout"/></svg>
            Sign out
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h2 id="page-title">Dashboard</h2>
          <div class="topbar-right">
            <div class="search">
              <svg class="i-18" aria-hidden="true"><use href="#icon-search"/></svg>
              <input id="global-search" placeholder="Search items, SKUs…">
            </div>
          </div>
        </header>

        <section class="view" id="view-root"></section>
      </main>
    </div>

    <!-- Toast container -->
    <div id="toast-wrap" aria-live="polite"></div>

    <!-- Modal container -->
    <div id="modal-root" hidden>
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal" role="dialog" aria-modal="true">
        <header>
          <h3 id="modal-title">Title</h3>
          <button class="icon-btn" id="modal-close" aria-label="Close">
            <svg class="i-20" aria-hidden="true"><use href="#icon-x"/></svg>
          </button>
        </header>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
  <script src="/xlsx.full.min.js" defer></script>
  <script src="/addon.js" defer></script>
</body>
</html>
